services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutu_okno
      POSTGRES_USER: tutu_okno
      POSTGRES_PASSWORD: tutu_okno
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutu_okno -d tutu_okno"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tutu_okno_postgres:/var/lib/postgresql/data

volumes:
  tutu_okno_postgres:
