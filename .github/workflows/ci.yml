name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutu_okno
          POSTGRES_USER: tutu_okno
          POSTGRES_PASSWORD: tutu_okno
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutu_okno -d tutu_okno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tutu_okno:tutu_okno@127.0.0.1:5432/tutu_okno
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
