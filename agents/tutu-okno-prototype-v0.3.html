.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

}

.form-check-label {

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {

.form-range::-webkit-slider-runnable-track {
  height: 28px;

}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tutu-okno-prototype&#x27;);
      if (!root || root.dataset.initialized === &#x27;true&#x27;) return;
      const screenMount = root.querySelector(&#x27;[data-screen-mount]&#x27;);
      if (!screenMount?.firstElementChild) return;
      root.dataset.initialized = &#x27;true&#x27;;
      const tabs = [...root.querySelectorAll(&#x27;.tutu-prototype-switcher [data-go]&#x27;)];
      const screenCache = new Map([[&#x27;calendar&#x27;, screenMount.firstElementChild]]);

      function showScreen(name) {
        let screen = screenCache.get(name);
        let isNewScreen = false;
        if (!screen) {
          const template = root.querySelector(`template[data-screen-template=&quot;${name}&quot;]`);
          if (!template?.content.firstElementChild) return;
          screen = template.content.firstElementChild.cloneNode(true);
          screenCache.set(name, screen);
          isNewScreen = true;
        }

        const openMenu = root.querySelector(&#x27;[data-participant-menu]&#x27;);
        openMenu?.classList.remove(&#x27;is-open&#x27;);
        root.querySelector(&#x27;[data-participant-toggle]&#x27;)?.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        screenMount.firstElementChild?.classList.remove(&#x27;is-active&#x27;);
        screen.classList.add(&#x27;is-active&#x27;);
        screenMount.replaceChildren(screen);
        tabs.forEach((tab) =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.go === name)));

        if (name === &#x27;manual&#x27;) updateManualAudience();
        if (name === &#x27;ideas&#x27;) updateSelectedCount();
        if (isNewScreen &amp;&amp; window.lucide) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      function getManualElements() {
        return {
          participantMenu: root.querySelector(&#x27;[data-participant-menu]&#x27;),
          participantInputs: [...root.querySelectorAll(&#x27;[data-participant-input]&#x27;)],
          onlyMeInput: root.querySelector(&#x27;[data-only-me]&#x27;),
          participantSummary: root.querySelector(&#x27;[data-participant-summary]&#x27;),
          manualSubmit: root.querySelector(&#x27;[data-manual-submit]&#x27;),
          manualModeButtons: [...root.querySelectorAll(&#x27;[data-manual-mode]&#x27;)]
        };
      }

      function setManualMode(mode) {
        const { onlyMeInput, manualSubmit, manualModeButtons } = getManualElements();
        if (!onlyMeInput || !manualSubmit) return;
        manualModeButtons.forEach((button) =&gt; {
          button.classList.toggle(&#x27;is-selected&#x27;, button.dataset.manualMode === mode);
          button.disabled = onlyMeInput.checked &amp;&amp; button.dataset.manualMode === &#x27;vote&#x27;;
        });
        manualSubmit.dataset.go = mode === &#x27;vote&#x27; ? &#x27;vote&#x27; : &#x27;calendar&#x27;;
        const label = manualSubmit.querySelector(&#x27;span&#x27;);
        if (label) label.textContent = mode === &#x27;vote&#x27; ? &#x27;Создать голосование&#x27; : &#x27;Добавить в план&#x27;;
      }

      function updateManualAudience() {
        const {
          participantInputs,
          onlyMeInput,
          participantSummary,
          manualSubmit
        } = getManualElements();
        if (!onlyMeInput || !participantSummary || !manualSubmit) return;
        const selected = participantInputs.filter((input) =&gt; input.checked);
        onlyMeInput.closest(&#x27;.tutu-only-me&#x27;)?.classList.toggle(&#x27;is-selected&#x27;, onlyMeInput.checked);
        if (onlyMeInput.checked) {
          participantSummary.textContent = &#x27;Только я&#x27;;
          setManualMode(&#x27;direct&#x27;);
        } else if (selected.length === participantInputs.length) {
          participantSummary.textContent = `Все участники · ${selected.length}`;
        } else if (selected.length &gt; 0) {
          participantSummary.textContent = selected.map((input) =&gt; input.value).join(&#x27;, &#x27;);
        } else {
          participantSummary.textContent = &#x27;Никто не выбран&#x27;;
        }
        manualSubmit.disabled = selected.length === 0;
      }

      function updateSelectedCount() {
        const count = root.querySelectorAll(&#x27;[data-option-card].is-selected&#x27;).length;
        const countNode = root.querySelector(&#x27;[data-selected-count]&#x27;);
        const sendButton = root.querySelector(&#x27;[data-send-ideas]&#x27;);
        if (countNode) countNode.textContent = String(count);
        if (sendButton) sendButton.disabled = count === 0;
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (!event.target.closest(&#x27;.tutu-participant-field&#x27;)) {
          root.querySelector(&#x27;[data-participant-menu]&#x27;)?.classList.remove(&#x27;is-open&#x27;);
          root.querySelector(&#x27;[data-participant-toggle]&#x27;)?.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        }

        const checkButton = event.target.closest(&#x27;[data-check-plan]&#x27;);
        if (checkButton) {
          if (checkButton.dataset.checkState === &#x27;done&#x27;) {
            showScreen(&#x27;audit&#x27;);
            return;
          }
          const scanOverlay = root.querySelector(&#x27;[data-scan-overlay]&#x27;);
          const reducedMotion = typeof window.matchMedia === &#x27;function&#x27; &amp;&amp; window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
          checkButton.disabled = true;
          checkButton.dataset.checkState = &#x27;scanning&#x27;;
          checkButton.setAttribute(&#x27;aria-busy&#x27;, &#x27;true&#x27;);
          checkButton.querySelector(&#x27;span&#x27;).textContent = &#x27;Проверяем…&#x27;;
          scanOverlay?.classList.add(&#x27;is-scanning&#x27;);
          window.setTimeout(() =&gt; {
            scanOverlay?.classList.remove(&#x27;is-scanning&#x27;);
            checkButton.disabled = false;
            checkButton.dataset.checkState = &#x27;done&#x27;;
            checkButton.setAttribute(&#x27;aria-busy&#x27;, &#x27;false&#x27;);
            checkButton.querySelector(&#x27;span&#x27;).textContent = &#x27;✓ 2 замечания&#x27;;
            showScreen(&#x27;audit&#x27;);
          }, reducedMotion ? 80 : 520);
          return;
        }

        const participantToggle = event.target.closest(&#x27;[data-participant-toggle]&#x27;);
        if (participantToggle) {
          const participantMenu = root.querySelector(&#x27;[data-participant-menu]&#x27;);
          if (!participantMenu) return;
          const isOpen = participantMenu.classList.toggle(&#x27;is-open&#x27;);
          participantToggle.setAttribute(&#x27;aria-expanded&#x27;, String(isOpen));
          return;
        }

        const optionButton = event.target.closest(&#x27;[data-option-add]&#x27;);
        if (optionButton) {
          const card = optionButton.closest(&#x27;[data-option-card]&#x27;);
          card.classList.toggle(&#x27;is-selected&#x27;);
          const selected = card.classList.contains(&#x27;is-selected&#x27;);
          optionButton.classList.toggle(&#x27;is-added&#x27;, selected);
          optionButton.textContent = selected ? &#x27;Добавлено&#x27; : &#x27;Добавить&#x27;;
          updateSelectedCount();
          return;
        }

        const voteButton = event.target.closest(&#x27;[data-vote-choice]&#x27;);
        if (voteButton) {
          const group = voteButton.closest(&#x27;.tutu-vote-card&#x27;);
          group.querySelectorAll(&#x27;[data-vote-choice]&#x27;).forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          voteButton.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          group.querySelector(&#x27;.tutu-own-vote&#x27;).textContent = `Ваш ответ: ${voteButton.dataset.voteChoice}`;
          return;
        }

        const personButton = event.target.closest(&#x27;[data-person]&#x27;);
        if (personButton) {
          root.querySelectorAll(&#x27;[data-person]&#x27;).forEach((button) =&gt; button.classList.remove(&#x27;is-selected&#x27;));
          personButton.classList.add(&#x27;is-selected&#x27;);
          return;
        }

        const segmentedButton = event.target.closest(&#x27;[data-segment] button&#x27;);
        if (segmentedButton) {
          segmentedButton.parentElement.querySelectorAll(&#x27;button&#x27;).forEach((button) =&gt; button.classList.remove(&#x27;is-selected&#x27;));
          segmentedButton.classList.add(&#x27;is-selected&#x27;);
          if (segmentedButton.dataset.manualMode) setManualMode(segmentedButton.dataset.manualMode);
          return;
        }

        const formatButton = event.target.closest(&#x27;[data-format-grid] button&#x27;);
        if (formatButton) {
          formatButton.parentElement.querySelectorAll(&#x27;button&#x27;).forEach((button) =&gt; button.classList.remove(&#x27;is-selected&#x27;));
          formatButton.classList.add(&#x27;is-selected&#x27;);
          return;
        }

        const auditButton = event.target.closest(&#x27;[data-audit-add]&#x27;);
        if (auditButton) {
          auditButton.textContent = &#x27;✓ Переезды добавлены&#x27;;
          auditButton.disabled = true;
          root.querySelector(&#x27;[data-audit-success]&#x27;).classList.add(&#x27;is-visible&#x27;);
          return;
        }

        const photoButton = event.target.closest(&#x27;[data-photo-generate]&#x27;);
        if (photoButton) {
          photoButton.textContent = &#x27;✓ Черновик создан&#x27;;
          photoButton.disabled = true;
          root.querySelector(&#x27;[data-photo-success]&#x27;).classList.add(&#x27;is-visible&#x27;);
          return;
        }

        const destination = event.target.closest(&#x27;[data-go]&#x27;);
        if (destination) showScreen(destination.dataset.go);
      });

      root.addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (event.target.matches(&#x27;[data-only-me]&#x27;)) {
          const { participantInputs, participantMenu, manualModeButtons } = getManualElements();
          if (event.target.checked) {
            participantInputs.forEach((input, index) =&gt; { input.checked = index === 0; });
            participantMenu?.classList.remove(&#x27;is-open&#x27;);
            root.querySelector(&#x27;[data-participant-toggle]&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
          } else {
            manualModeButtons.forEach((button) =&gt; { button.disabled = false; });
          }
          updateManualAudience();
          return;
        }

        if (event.target.matches(&#x27;[data-participant-input]&#x27;)) {
          const { onlyMeInput, manualModeButtons } = getManualElements();
          if (!onlyMeInput) return;
          onlyMeInput.checked = false;
          manualModeButtons.forEach((button) =&gt; { button.disabled = false; });
          updateManualAudience();
        }
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
